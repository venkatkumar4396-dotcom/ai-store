services:

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: nexusforge-db
    environment:
      POSTGRES_USER: nexusforge
      POSTGRES_PASSWORD: nexusforge_secret
      POSTGRES_DB: nexusforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis (for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: nexusforge-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Python AI Service
  ai-service:
    build: ./ai-service
    container_name: nexusforge-ai-service
    ports:
      - "8001:8001"
    environment:
      - AI_SERVICE_TOKEN=default-ai-service-token-change-me
    restart: unless-stopped

  # Node.js backend API
  backend:
    build: ./backend
    container_name: nexusforge-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:3000
      - DATABASE_URL=postgresql://nexusforge:nexusforge_secret@postgres:5432/nexusforge?schema=public
      - JWT_SECRET=your-production-super-secret-jwt-key
      - ENCRYPTION_KEY=your-production-32-char-key!!!!
      - GEMINI_API_KEY=your-gemini-api-key-here
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Next.js frontend
  frontend:
    build: ./frontend
    container_name: nexusforge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
