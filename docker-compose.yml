services:

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: nexusforge-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-nexusforge}
    # DB only accessible from within docker network — not exposed to host
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - internal

  # Redis (for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: nexusforge-redis
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - internal

  # Python AI Service
  ai-service:
    build: ./ai-service
    container_name: nexusforge-ai-service
    expose:
      - "8001"
    environment:
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN must be set}
    restart: unless-stopped
    networks:
      - internal

  # Node.js backend API
  backend:
    build: ./backend
    container_name: nexusforge-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN must be set}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nexusforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexusforge}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (min 32 chars)}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (min 32 chars)}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - internal
      - external

  # Next.js frontend
  frontend:
    build: ./frontend
    container_name: nexusforge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - external

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
    internal: true   # No external access — DB and Redis isolated
  external:
    driver: bridge
