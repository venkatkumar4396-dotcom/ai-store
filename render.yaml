databases:
  - name: nexusforge-db
    databaseName: nexusforge
    user: nexusforge
    plan: free

services:
  # Express Backend API
  - type: web
    name: nexusforge-backend
    env: node
    rootDir: backend
    buildCommand: npm install --production=false && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexusforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: nexusforge-frontend
          property: url

  # Next.js Frontend
  - type: web
    name: nexusforge-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nexusforge-backend
          property: url
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: nexusforge-backend
          property: url
